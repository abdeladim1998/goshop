<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - Go Shop</title>
    
    <!-- شفرة Google AdSense الأساسية -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4870324877866276"
         crossorigin="anonymous"></script>

    <!-- FontAwesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #030712;
            color: #f8fafc;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* الهيدر المتناسق مع الصفحة الرئيسية */
        header {
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
            color: #fff;
            padding: 45px 20px 30px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        header::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
        }

        /* الشعار الهولوغرامي */
        .hologram-wrapper {
            position: relative;
            z-index: 2;
            display: inline-block;
            perspective: 1200px;
            margin-bottom: 20px;
        }

        .hologram-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 15px 40px;
            border-radius: 24px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.7),
                inset 0 0 20px rgba(56, 189, 248, 0.1);
            transform-style: preserve-3d;
            animation: floatAdvanced 5s ease-in-out infinite;
        }

        .hologram-logo {
            font-size: 3.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.6));
            transform: translateZ(50px);
        }

        .hologram-logo span {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes floatAdvanced {
            0% {
                transform: translateY(0px) rotateX(12deg) rotateY(-12deg) rotateZ(0deg);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.3);
            }
            50% {
                transform: translateY(-15px) rotateX(-12deg) rotateY(12deg) rotateZ(1deg);
                box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9), 0 0 50px rgba(192, 132, 252, 0.5);
            }
            100% {
                transform: translateY(0px) rotateX(12deg) rotateY(-12deg) rotateZ(0deg);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.3);
            }
        }

        /* زر العودة للرئيسية بحواف منحنية */
        .btn-back-home {
            position: relative;
            z-index: 2;
            color: #38bdf8;
            text-decoration: none;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back-home:hover {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transform: translateY(-2px);
        }

        /* حاوية الإعلانات المتوسطة */
        .ad-container {
            max-width: 900px;
            margin: 25px auto 10px auto;
            padding: 0 15px;
            text-align: center;
        }
        .ad-box-medium {
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 12px;
            min-height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* الحاوية الرئيسية بتصميم زجاجي عائم */
        .container {
            max-width: 1000px;
            margin: 20px auto 40px auto;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            position: relative;
            z-index: 2;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                margin: 15px;
                padding: 20px;
            }
            .hologram-logo {
                font-size: 2.3rem;
            }
            .hologram-card {
                padding: 10px 25px;
            }
        }

        /* معرض الصور */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .main-img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            background-color: #1e293b;
        }
        .thumbnails {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .thumb {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            background-color: #1e293b;
        }
        .thumb:hover, .thumb.active {
            border-color: #38bdf8;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* قسم المعلومات والوصف */
        .details h2 {
            font-size: 2rem;
            color: #f8fafc;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.6rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(56,189,248,0.3);
        }
        .description-box {
            background: rgba(3, 7, 18, 0.6);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }
        .description-box p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.7;
        }
        .btn-more-desc {
            background: none;
            border: none;
            color: #38bdf8;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }
        .btn-more-desc:hover {
            color: #818cf8;
            text-decoration: underline;
        }

        /* استمارة الشراء */
        .order-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
        }
        .order-form h3 {
            font-size: 1.1rem;
            color: #f8fafc;
            margin-bottom: 2px;
        }
        .order-form input {
            padding: 12px 15px;
            background: #030712;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        .order-form input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56,189,248,0.2);
        }
        .btn-submit {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: #020617;
            color: #64748b;
            margin-top: 50px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <!-- الهيدر مع الشعار الهولوغرامي وزر العودة الأنيق بأسفله -->
    <header>
        <div class="hologram-wrapper">
            <div class="hologram-card">
                <h1 class="hologram-logo">Go <span>Shop</span></h1>
            </div>
        </div>
        <a href="index.html" class="btn-back-home">
            <i class="fa-solid fa-arrow-right"></i> العودة للصفحة الرئيسية
        </a>
    </header>

    <!-- إعلان علوي متوسط الحجم -->
    <div class="ad-container">
        <div class="ad-box-medium">
            <ins class="adsbygoogle"
                 style="display:block; width:100%; height:100%"
                 data-ad-client="ca-pub-4870324877866276"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <div class="container">
        <!-- معرض الصور (متعدد الصور) -->
        <div class="gallery">
            <img id="mainImage" src="" alt="صورة المنتج" class="main-img">
            <div class="thumbnails" id="thumbnailContainer">
                <!-- تعبئة الصور المصغرة ديناميكياً -->
            </div>
        </div>

        <!-- معلومات المنتج ووصفه التفاعلي واستمارة الشراء -->
        <div class="details">
            <h2 id="productTitle">اسم المنتج</h2>
            <div class="price" id="productPrice">0 درهم</div>
            
            <div class="description-box">
                <p id="shortDesc">جاري تحميل الوصف المختصر...</p>
                <p id="fullDesc" style="display: none;">هذا هو باقي الوصف التفصيلي والتقني للمنتج، والذي يمنح العميل نظرة شاملة ومتكاملة حول الخصائص والمميزات الاستثنائية التي تجعل هذا المنتج الخيار الأمثل لك.</p>
                <button type="button" class="btn-more-desc" id="toggleDescBtn" onclick="toggleDescription()">
                    <span>عرض المزيد (التالي)</span> <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>

            <!-- استمارة إدخال المعلومات لإتمام الشراء الفوري -->
            <form class="order-form" onsubmit="submitOrder(event)">
                <h3>أدخل معلوماتك لإتمام الطلب:</h3>
                <input type="text" id="custName" placeholder="الاسم الكامل" required>
                <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
                <input type="text" id="custAddress" placeholder="المدينة والعنوان التفصيلي" required>
                <button type="submit" class="btn-submit">
                    <i class="fa-brands fa-whatsapp fa-lg"></i> تأكيد الطلب عبر الواتساب
                </button>
            </form>
        </div>
    </div>

    <!-- إعلان سفلي متوسط الحجم قبل الفوتر -->
    <div class="ad-container">
        <div class="ad-box-medium">
            <ins class="adsbygoogle"
                 style="display:block; width:100%; height:100%"
                 data-ad-client="ca-pub-4870324877866276"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; Go Shop 2026</p>
    </footer>

    <script>
        // قاعدة البيانات الشاملة للمنتجات (الصور، الأسعار، والأوصاف)
        const productsData = {
            "1": {
                name: "اسم المنتج الأول",
                price: "199 درهم",
                short: "هذا هو الجزء الأول المختصر من وصف المنتج الأول المصمم بأحدث التقنيات...",
                full: "هذا هو باقي الوصف التفصيلي والتقني للمنتج الأول، مصمم ليوفر أقصى درجات الأداء والكفاءة العالية مع ضمان ممتد وجودة تصنيع استثنائية تلبي تطلعاتك.",
                images: [
                    "https://via.placeholder.com/600/0f172a/38bdf8?text=Product+1+-+Image+1",
                    "https://via.placeholder.com/600/1e293b/818cf8?text=Product+1+-+Image+2",
                    "https://via.placeholder.com/600/334155/38bdf8?text=Product+1+-+Image+3",
                    "https://via.placeholder.com/600/0f172a/c084fc?text=Product+1+-+Image+4"
                ]
            },
            "2": {
                name: "اسم المنتج الثاني",
                price: "299 درهم",
                short: "هذا هو الجزء الأول المختصر من وصف المنتج الثاني المخصص للعمل الشاق...",
                full: "هذا هو باقي الوصف التفصيلي للمنتج الثاني الذي يتميز بخامات ممتازة مقاومة للصدمات وعمر افتراضي طويل يضمن لك أفضل تجربة استخدام ممكنة.",
                images: [
                    "https://via.placeholder.com/600/1e293b/22c55e?text=Product+2+-+Image+1",
                    "https://via.placeholder.com/600/0f172a/38bdf8?text=Product+2+-+Image+2",
                    "https://via.placeholder.com/600/334155/22c55e?text=Product+2+-+Image+3"
                ]
            },
            "3": {
                name: "اسم المنتج الثالث",
                price: "399 درهم",
                short: "هذا هو الجزء الأول المختصر من وصف المنتج الثالث الفاخر...",
                full: "هذا هو باقي الوصف التفصيلي والتقني للمنتج الثالث، الخيار الأمثل لمن يبحث عن الفخامة والأداء الفائق في جهاز واحد متطور.",
                images: [
                    "https://via.placeholder.com/600/334155/eab308?text=Product+3+-+Image+1",
                    "https://via.placeholder.com/600/0f172a/38bdf8?text=Product+3+-+Image+2",
                    "https://via.placeholder.com/600/1e293b/eab308?text=Product+3+-+Image+3"
                ]
            },
            "4": {
                name: "اسم المنتج الرابع",
                price: "149 درهم",
                short: "هذا هو الجزء الأول المختصر من وصف المنتج الرابع العصري...",
                full: "هذا هو باقي الوصف التفصيلي للمنتج الرابع، تصميم ذكي وعصري خفيف الوزن يناسب الاستخدام اليومي بكل سلاسة ومرونة.",
                images: [
                    "https://via.placeholder.com/600/0f172a/ec4899?text=Product+4+-+Image+1",
                    "https://via.placeholder.com/600/1e293b/38bdf8?text=Product+4+-+Image+2",
                    "https://via.placeholder.com/600/334155/ec4899?text=Product+4+-+Image+3"
                ]
            }
        };

        // استخراج معرف المنتج من الرابط (URL)
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id') || '1';
        const product = productsData[productId] || productsData['1'];

        // تعبئة البيانات في العناصر
        document.getElementById('productTitle').innerText = product.name;
        document.getElementById('productPrice').innerText = product.price;
        document.getElementById('shortDesc').innerText = product.short;
        document.getElementById('fullDesc').innerText = product.full;

        // إدارة معرض الصور التفاعلي
        const mainImage = document.getElementById('mainImage');
        const thumbContainer = document.getElementById('thumbnailContainer');
        
        mainImage.src = product.images[0];

        product.images.forEach((imgSrc, index) => {
            const thumb = document.createElement('img');
            thumb.src = imgSrc;
            thumb.className = `thumb ${index === 0 ? 'active' : ''}`;
            thumb.onclick = () => {
                mainImage.src = imgSrc;
                document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
                thumb.classList.add('active');
            };
            thumbContainer.appendChild(thumb);
        });

        // زر عرض المزيد (التالي للوصف)
        function toggleDescription() {
            const fullDesc = document.getElementById('fullDesc');
            const btn = document.getElementById('toggleDescBtn');
            if (fullDesc.style.display === 'none') {
                fullDesc.style.display = 'block';
                btn.innerHTML = '<span>إخفاء التفاصيل</span> <i class="fa-solid fa-chevron-up"></i>';
            } else {
                fullDesc.style.display = 'none';
                btn.innerHTML = '<span>عرض المزيد (التالي)</span> <i class="fa-solid fa-chevron-down"></i>';
            }
        }

        // إتمام الشراء وحفظ الطلب في الذاكرة وإرساله مباشرة للواتساب
        function submitOrder(event) {
            event.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const myPhoneNumber = "212634743332"; // رقم الواتساب الخاص بك

            const newOrder = {
                id: '#' + Math.floor(1000 + Math.random() * 9000),
                product: product.name,
                customer: name,
                phone: phone,
                address: address,
                price: product.price,
                status: 'قيد الانتظار',
                date: new Date().toISOString().split('T')[0]
            };

            let orders = JSON.parse(localStorage.getItem('goShopOrders')) || [];
            orders.unshift(newOrder);
            localStorage.setItem('goShopOrders', JSON.stringify(orders));

            const message = `طلب جديد من متجر *Go Shop*%0A` +
                            `------------------------%0A` +
                            `📦 المنتج: ${product.name}%0A` +
                            `💰 السعر: ${product.price}%0A` +
                            `👤 الاسم: ${name}%0A` +
                            `📞 الهاتف: ${phone}%0A` +
                            `📍 العنوان: ${address}`;

            const whatsappURL = `https://wa.me/${myPhoneNumber}?text=${message}`;
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
